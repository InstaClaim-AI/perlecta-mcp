[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "perlecta"
version = "0.4.0"
description = "Reveals content that is present in a document but invisible on screen, with a local MCP server for AI agents"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "InstaClaim AI" }]
keywords = [
    "prompt-injection",
    "indirect-prompt-injection",
    "hidden-text",
    "pdf",
    "mcp",
    "ai-agents",
    "document-security",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Typing :: Typed",
]
# Le moteur n'importe que la bibliotheque standard et pikepdf (D1).
dependencies = [
    "pikepdf>=8",
]

[project.urls]
Homepage = "https://github.com/InstaClaim-AI/perlecta-mcp"
Repository = "https://github.com/InstaClaim-AI/perlecta-mcp"
Issues = "https://github.com/InstaClaim-AI/perlecta-mcp/issues"

[project.optional-dependencies]
rendu = ["pymupdf>=1.24", "pytesseract>=0.3"]
service = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9"]
mcp = ["mcp>=2.3,<3"]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10", "reportlab>=4", "httpx>=0.27"]

[project.scripts]
perlecta = "perlecta.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
perlecta = ["corpus/*.json", "py.typed"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# le generateur de pieces d'essai porte du XML et du HTML litteraux
"tests/fixtures/generer.py" = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
